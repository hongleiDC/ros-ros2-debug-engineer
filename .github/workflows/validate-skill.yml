name: validate-noetic-skill

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  validate:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.8'
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python scripts/preflight.py --require knowledge
      - name: Full Noetic regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate and package skill
        run: python scripts/package_skill.py . dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: ros-noetic-skill
          path: dist/skill.zip
