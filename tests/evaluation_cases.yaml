schema_version: 1
purpose: Manual behavior regression cases for architecture quality, token efficiency, evidence closure, and AI-independent analysis design.
cases:
  - id: micro-cmake-error
    prompt: Explain this single CMake target_link_libraries error and provide the smallest fix.
    expected_mode: debug
    expected_scale: micro
    max_references: 0
    max_hypotheses: 1
    forbidden: [repository-wide scan, GOAL, FORM, MAP, REAS, AUD, result bundle]
    required: [root cause, minimal patch, focused validation]
  - id: standard-no-messages
    prompt: The ROS 2 publisher and subscriber both exist but the callback receives no messages.
    expected_mode: debug
    expected_scale: standard
    max_references: 1
    max_hypotheses: 3
    forbidden: [full repository scan, unrelated refactor]
    required: [message type, endpoint QoS, namespace or remap]
  - id: architect-human-analyzable-lio
    prompt: Design a LiDAR-IMU-RTK localization subsystem that our engineers can diagnose from saved results even when ChatGPT is unavailable.
    expected_mode: architect
    expected_scale: subsystem
    max_hypotheses: 0
    forbidden: [AI-only analysis workflow, ad-hoc per-run plotting, telemetry without semantics]
    required: [Algorithm Contract, Observation Contract, Result Contract, Visualization Contract, Human Analysis Contract, stable units and frames, project-local static report]
  - id: runtime-ab-result-bundle
    prompt: Compare baseline and candidate localization configs on the same bag and leave a result that another engineer can inspect later without AI.
    expected_mode: debug
    expected_scale: domain
    max_hypotheses: 3
    forbidden: [scattered top-level temp files, generic dashboard platform, AI-only verdict]
    required: [RUN result bundle, normalized metrics, baseline candidate comparison, static human report, repeatable analysis profile]
  - id: slam-longitudinal-root-cause
    prompt: Bag2-1 develops a longitudinal error. Design the evidence path so a human can determine whether prediction, scan update, observability, or map feedback fails first.
    expected_mode: debug
    expected_scale: domain
    max_hypotheses: 3
    forbidden: [plotting every telemetry field, research-only production pollution, depending on Agent interpretation for basic navigation]
    required: [Core Evidence, Observation Contract, shared time or distance axis, prediction evidence, matching correction, observability evidence, fixed reading order, static index.html]
  - id: audit-controller-deployment
    prompt: Audit and modify a controller timing compensation implementation before hardware deployment.
    expected_mode: audit
    expected_scale: high-risk-change
    max_hypotheses: 3
    forbidden: [claiming safety from static review alone]
    required: [success criteria, formula mapping, experiment evidence, result closure, rollback]
